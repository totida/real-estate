name: 부산 아파트 25평 새 매물 알림

# 네이버 부동산이 GitHub 서버(해외 클라우드 IP) 접속을 막아 예약 실행을 꺼 두었다.
# 한국 인터넷에 연결된 self-hosted runner 를 쓰게 되면 아래 schedule 주석을 풀고
# runs-on 을 self-hosted 로 바꾼다.
on:
  # schedule:
  #   - cron: "*/30 * * * *"   # 30분마다
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: naver-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라벨 준비
        run: gh label create "새매물" --color FF7F50 --force || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 매물 조회
        run: python naver_alert.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/seen.json
          git diff --cached --quiet || git commit -m "매물 상태 갱신 [skip ci]"
          git push
